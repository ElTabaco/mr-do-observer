apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape kubelet cAdvisor metrics from each node (CPU/mem/network per pod)
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # Scrape pods that explicitly opt in via the annotation:
      #   prometheus.io/scrape: "true"
      # Optional annotations:
      #   prometheus.io/port: "9090"   (override the discovered port)
      #   prometheus.io/path: "/metrics" (override the metrics path)
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only keep pods annotated with prometheus.io/scrape=true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Drop kube-system, argocd, and metallb-system namespaces
          # (kube-system/argocd = infra noise; metallb = scraped via its own
          # HTTPS job below, since its metrics port 9120 requires scheme: https)
          - source_labels: [__meta_kubernetes_namespace]
            action: drop
            regex: kube-system|argocd|metallb-system
          # Override the metrics path if the annotation is set
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Override the port if the annotation is set
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Add useful labels
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      # kube-state-metrics (deployed in kube-system via kubernetes/kube-state-metrics/)
      # Exposes kubernetes_* metrics: Deployments, Pods, PVCs, HPAs, etc.
      - job_name: 'kube-state-metrics'
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: kube-state-metrics;http-metrics

      # MetalLB — metrics on port 9120 over HTTPS (annotation-based scraping
      # can't set scheme: https, so MetalLB gets its own job).
      # The :9120 endpoint also requires bearer token auth.
      # Docs: https://metallb.universe.tf/configuration/#prometheus-metrics
      - job_name: 'metallb'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - metallb-system
        relabel_configs:
          # Keep only MetalLB pods
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: metallb
          # Keep only the metricshttps port (named 9120) — excludes webhook
          # (9443) and memberlist (7946) ports on the same pods
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metricshttps
          - source_labels: [__address__]
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: component

      # LLM servers (outside k3s) — dashboard "LLM Servers / LLM Server Overview".
      # Exporters installed by hosts/llm-server/install-exporters.sh. Every target
      # carries a `server` label; the dashboard's server dropdown is built from it.
      # Add a new LLM server by adding its targets to all jobs that apply.
      - job_name: 'llm-node'                 # prometheus-node-exporter (+ llm_model_*/llm_slot_*/llm_gpu_* textfile metrics)
        static_configs:
          - targets: ['192.168.0.243:9100']
            labels:
              server: 'mr-v100-server'
          - targets: ['192.168.0.242:9100']
            labels:
              server: 'mr-r9700-server'
      - job_name: 'llm-gpu-nvidia'           # nvidia_gpu_exporter (NVIDIA GPUs only; AMD GPUs come via llm-node as llm_gpu_*)
        static_configs:
          - targets: ['192.168.0.243:9835']
            labels:
              server: 'mr-v100-server'
      - job_name: 'llm-llamacpp'             # llama-server --metrics (llamacpp:* metrics)
        static_configs:
          - targets: ['192.168.0.243:8080']
            labels:
              server: 'mr-v100-server'
          - targets: ['192.168.0.242:8080']
            labels:
              server: 'mr-r9700-server'
