# Grafana alert delivery to CallMeBot (Telegram/WhatsApp). Grafana's webhook contact point
# "callmebot" (alerting-configmap.yml) posts here; the relay turns the alert into a CallMeBot GET.
# Secret callmebot-relay (key "urls", one URL template per line with {text}) is created out of
# band, never in Git:
#   kubectl -n monitoring create secret generic callmebot-relay --from-file=urls=/dev/stdin
apiVersion: apps/v1
kind: Deployment
metadata:
  name: callmebot-relay
  namespace: monitoring
  labels:
    app: callmebot-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: callmebot-relay
  template:
    metadata:
      labels:
        app: callmebot-relay
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: docker.io/library/python:3.15.2-alpine3.24@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/app/relay.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: CALLMEBOT_URLS
              valueFrom:
                secretKeyRef:
                  name: callmebot-relay
                  key: urls
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 60
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: callmebot-relay
---
apiVersion: v1
kind: Service
metadata:
  name: callmebot-relay
  namespace: monitoring
  labels:
    app: callmebot-relay
spec:
  type: ClusterIP
  selector:
    app: callmebot-relay
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Only Grafana may post alerts to the relay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: callmebot-relay
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: callmebot-relay
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 8080
