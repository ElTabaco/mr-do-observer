# Grafana alerting provisioning: contact point callmebot (-> callmebot-relay) + mr-jellyfin rules.
# Generated by scripts/gen-jellyfin-monitoring.py - edit the script, not this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
  labels:
    app: grafana
data:
