        {
          "orgId": 1,
          "name": "callmebot",
          "receivers": [
            {
              "uid": "callmebot-relay",
              "type": "webhook",
              "disableResolveMessage": false,
              "settings": {
                "url": "http://callmebot-relay.monitoring.svc.cluster.local:8080/alert",
                "httpMethod": "POST"
              }
            }
          ]
        }
      ],
      "groups": [
        {
          "orgId": 1,
          "name": "mr-jellyfin",
          "folder": "Jellyfin",
          "interval": "1m",
          "rules": [
            {
              "uid": "jf-down",
              "title": "JellyfinDown",
              "condition": "C",
              "data": [
                {
                  "refId": "A",
                  "relativeTimeRange": {
                    "from": 900,
                    "to": 0
                  },
                  "datasourceUid": "PBFA97CFB590B2093",
                  "model": {
                    "refId": "A",
                    "expr": "1 - min(up{namespace=\"mr-do-jellyfin\", app=\"mr-do-jellyfin\"} or jellyfin_up{namespace=\"mr-do-jellyfin\"})",
                    "instant": true,
                    "range": false,
                    "intervalMs": 15000,
                    "maxDataPoints": 43200
                  }
                },
                {
                  "refId": "C",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "datasourceUid": "__expr__",
                  "model": {
                    "refId": "C",
                    "type": "threshold",
                    "expression": "A",
                    "conditions": [
                      {
                        "evaluator": {
                          "type": "gt",
                          "params": [
                            0
                          ]
                        }
                      }
                    ]
                  }
                }
              ],
              "for": "5m",
              "noDataState": "Alerting",
              "execErrState": "Error",
              "labels": {
                "severity": "critical",
                "project": "mr-jellyfin"
              },
              "annotations": {
                "summary": "Jellyfin is down or not answering its API",
                "description": "Pod scrape or jellyfin_up failed for 5 min. kubectl -n mr-do-jellyfin get pods; scripts/healthcheck.sh; docs/troubleshooting.md"
              },
              "isPaused": false,
              "notification_settings": {
                "receiver": "callmebot",
                "group_by": [
                  "alertname"
                ],
                "repeat_interval": "12h"
              }
            },
            {
